name: DB Migrate

on:
  push:
    branches: [main]
    paths: ['db/migrations/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: db-migrate

env:
  GCP_PROJECT: bap-tmd
  GCP_ZONE: europe-west3-a
  VM_NAME: tsdb-vm
  DB_NAME: istmd

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Veritabanina IAP tuneli ac
        run: |
          gcloud compute start-iap-tunnel "$VM_NAME" 5432 \
            --local-host-port=127.0.0.1:5432 \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT" > tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5432; then echo "Tunel hazir"; exit 0; fi
            sleep 1
          done
          echo "Tunel acilamadi:"; cat tunnel.log; exit 1

      - name: Flyway migrate
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/flyway/migrations" \
            flyway/flyway:10 \
            -locations=filesystem:/flyway/migrations \
            -url=jdbc:postgresql://127.0.0.1:5432/$DB_NAME \
            -user=migrator \
            -password="${{ secrets.DB_PASSWORD }}" \
            -connectRetries=5 \
            migrate
